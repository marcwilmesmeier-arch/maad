<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>maad – Administration</title>
<style>
body{margin:0;background:#f2f2f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1d1d1b}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:24px 0}
.logo{font-weight:700;font-size:26px;letter-spacing:-.5px;text-decoration:none}
.tag{font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#5f5f5c}
h1{margin:6px 0 4px;font-size:28px;letter-spacing:-.5px}
.sub{font-size:14px;color:#5f5f5c;margin-bottom:22px}
.tabs{display:inline-flex;gap:4px;background:#e4e4e0;border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;color:#4a4a47}
.tabs button.on{background:#fff;color:#1d1d1b}
.card{background:#fff;border:1px solid #e0e0dc;border-radius:20px;padding:22px;margin-bottom:18px}
.tbl{overflow-x:auto;background:#fff;border:1px solid #e0e0dc;border-radius:20px}
table{width:100%;min-width:760px;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:14px 14px;border-bottom:1px solid #e8e8e4;color:#5f5f5c;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
td{padding:13px 14px;border-bottom:1px solid #f0f0ec;vertical-align:middle}
tr:last-child td{border-bottom:0}
.pill{border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;background:#e4e4e0}
.pill.dark{background:#1d1d1b;color:#fff}
.st-active{color:#17623d;font-weight:600}.st-invited{color:#8a5200;font-weight:600}.st-blocked{color:#a6261d;font-weight:600}
button.b,a.b{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border:1px solid #d6d6d2;border-radius:10px;background:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;margin:2px;text-decoration:none;color:#1d1d1b}
button.pri{min-height:46px;padding:0 24px;border:0;border-radius:12px;background:#1d1d1b;color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email],input[type=date],select{width:100%;box-sizing:border-box;height:44px;border:1px solid #cfcfcb;border-radius:12px;padding:0 12px;font-size:14px;font-family:inherit;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 16px;margin-top:6px}
.perms label{display:flex;align-items:center;gap:10px;font-weight:500;min-height:38px;margin:0}
.perms input{width:18px;height:18px;accent-color:#1d1d1b}
.msg{font-size:13px;margin:10px 0 0;min-height:18px}
.hide{display:none}
</style></head><body>
<div class="wrap">
<div class="top"><a class="logo" href="/">maad</a><span class="tag">Administration</span><span style="flex:1"></span><span id="me" style="font-size:13px;color:#4a4a47"></span><a class="b" href="/">Zum Tool</a><button class="b" id="out">Abmelden</button></div>
<h1>Kunden</h1><div class="sub">Wer maad nutzen darf, mit welchem Abo und welchen Berechtigungen.</div>
<div class="tabs"><button id="t1" class="on">Kunden</button><button id="t2">Freigeben</button><button id="t3">Protokoll</button></div>

<div id="p1"><div class="tbl"><table><thead><tr><th>E-Mail</th><th>Name / Büro</th><th>Abo</th><th>Rolle</th><th>Status</th><th>Gültig bis</th><th>Letzte Anmeldung</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="msg" id="m1"></div></div>

<div id="p2" class="hide"><div class="card">
<div class="grid">
<div><label for="i_e">E-Mail-Adresse</label><input id="i_e" type="email" placeholder="name@buero.de"></div>
<div><label for="i_n">Name (optional)</label><input id="i_n" type="text"></div>
<div><label for="i_o">Büro / Organisation</label><input id="i_o" type="text"></div>
<div><label for="i_p">Abo</label><select id="i_p"></select></div>
<div><label for="i_r">Rolle</label><select id="i_r"></select></div>
<div><label for="i_v">Gültig bis (leer = unbefristet)</label><input id="i_v" type="date"></div>
</div>
<div style="margin-top:16px;font-weight:700;font-size:14px">Berechtigungen <span style="font-weight:500;color:#5f5f5c">(durch das Abo vorbelegt, einzeln änderbar)</span></div>
<div class="perms" id="perms"></div>
<div style="margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"><button class="pri" id="inv">Freigeben und Einladung senden</button><label style="display:flex;align-items:center;gap:8px;margin:0;font-weight:500"><input type="checkbox" id="i_s" checked style="width:18px;height:18px;accent-color:#1d1d1b">E-Mail senden</label></div>
<div class="msg" id="m2" role="status"></div>
</div></div>

<div id="p3" class="hide"><div class="tbl"><table><thead><tr><th>Zeit (UTC)</th><th>Person</th><th>Ereignis</th><th>Detail</th></tr></thead><tbody id="logrows"></tbody></table></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let D=null;
const PN={project_new:'Neues Projekt anlegen',project_open:'Projekte öffnen und speichern',export_xlsx:'Excel-Export',export_ifc:'IFC-Export',lod:'Detailstufen LoD2/LoD3',team:'Projekte im Team teilen',own_sources:'Eigene Datenquellen'};
const AN={demo:'Demo',starter:'Starter',buero:'Büro',enterprise:'Enterprise'},RN={user:'Nutzer',lead:'Projektleiter',admin:'Administrator'},SN={active:'Aktiv',invited:'Eingeladen',blocked:'Gesperrt'};
async function api(path,body){const o=body?{method:'POST',headers:{'Content-Type':'application/json','X-Maad':'1'},body:JSON.stringify(body)}:{};const r=await fetch(path,o);const j=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='/login';throw new Error('Anmeldung nötig')}if(!r.ok)throw new Error(j.error||'Fehler');return j}
function el(t,props,...kids){const e=document.createElement(t);Object.assign(e,props||{});for(const k of kids)e.append(k);return e}
function tab(n){for(const i of[1,2,3]){$('p'+i).classList.toggle('hide',i!==n);$('t'+i).classList.toggle('on',i===n)}if(n===3)loadLog()}
['t1','t2','t3'].forEach((id,i)=>$(id).onclick=()=>tab(i+1));
async function load(){D=await api('/api/admin/users');const me=await api('/api/me');$('me').textContent=me.user?me.user.email:'';fillForm();draw()}
function draw(){const tb=$('rows');tb.textContent='';
 for(const u of D.users){const tr=el('tr');
  tr.append(el('td',{style:'font-weight:600'},u.email),el('td',{},(u.name||'')+(u.org?(u.name?' · ':'')+u.org:'')),
   el('td',{},el('span',{className:'pill'+(u.plan==='buero'?' dark':'')},AN[u.plan]||u.plan)),el('td',{},RN[u.role]||u.role),
   el('td',{className:'st-'+u.status},'● '+(SN[u.status]||u.status)),el('td',{},u.valid_until||'unbefristet'),el('td',{},u.last_login?u.last_login.replace('T',' ').replace('Z',''):'–'));
  const td=el('td',{style:'text-align:right;white-space:nowrap'});
  const act=(txt,a,conf)=>td.append(el('button',{className:'b',onclick:async()=>{if(conf&&!confirm(conf))return;try{await api('/api/admin/user',{email:u.email,action:a});$('m1').textContent=a==='resend'?'Link gesendet.':'Gespeichert.';await load()}catch(e){$('m1').textContent=e.message}}},txt));
  td.append(el('button',{className:'b',onclick:()=>edit(u)},'Bearbeiten'));
  act('Link senden','resend');
  if(u.status==='blocked')act('Entsperren','unblock');else act('Sperren','block','„'+u.email+'“ sperren?');
  act('Löschen','delete','„'+u.email+'“ endgültig löschen?');
  tr.append(td);tb.append(tr)}}
function fillForm(){const p=$('i_p'),r=$('i_r');if(!p.options.length){for(const k of Object.keys(D.plans))p.append(el('option',{value:k},AN[k]||k));for(const k of D.roles)r.append(el('option',{value:k},RN[k]||k));p.value='starter';
 const bx=$('perms');for(const k of D.perms){const c=el('input',{type:'checkbox',id:'pm_'+k});bx.append(el('label',{},c,PN[k]||k))}p.onchange=()=>setPerms(D.plans[p.value])}
 setPerms(D.plans[p.value])}
function setPerms(list){for(const k of D.perms)$('pm_'+k).checked=list.includes(k)}
function edit(u){tab(2);$('i_e').value=u.email;$('i_n').value=u.name;$('i_o').value=u.org;$('i_p').value=u.plan;$('i_r').value=u.role;$('i_v').value=u.valid_until||'';setPerms(u.perms);$('i_s').checked=false;$('m2').textContent='Bestehenden Kunden bearbeiten – „E-Mail senden“ ist aus.'}
$('inv').onclick=async()=>{$('m2').textContent='';const perms=D.perms.filter(k=>$('pm_'+k).checked);
 try{const j=await api('/api/admin/invite',{email:$('i_e').value,name:$('i_n').value,org:$('i_o').value,plan:$('i_p').value,role:$('i_r').value,valid_until:$('i_v').value,perms,send:$('i_s').checked});
  $('m2').textContent=j.mail?'Freigegeben, Einladung gesendet.':($('i_s').checked?'Freigegeben, aber die E-Mail konnte nicht gesendet werden (siehe Protokoll).':'Gespeichert.');
  $('i_e').value='';$('i_n').value='';$('i_o').value='';await load()}catch(e){$('m2').textContent=e.message}};
async function loadLog(){const j=await api('/api/admin/log'),tb=$('logrows');tb.textContent='';for(const l of j.log)tb.append(el('tr',{},el('td',{},l.ts.replace('T',' ').replace('Z','')),el('td',{},l.email||''),el('td',{},l.event),el('td',{},l.detail||'')))}
$('out').onclick=async()=>{await api('/api/logout',{}).catch(()=>{});location.href='/login'};
load().catch(()=>{});
</script></body></html>
